<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <!-- Fetched before the CSS that references it, so the swap from the
         fallback happens as early as possible. crossorigin is required even
         same-origin: fonts are always fetched in CORS mode, and without it the
         browser downloads the file twice. -->
    <link
      rel="preload"
      href="/fonts/satoshi-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Uang" />
    <title>Uang — Personal Finance</title>
    <meta name="description" content="Track income and expenses in your own Google Sheet — works offline." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
