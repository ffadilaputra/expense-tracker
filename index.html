<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colours the system status bar on Android. Two entries so it tracks the
         app instead of being a fixed dark bar above a white header; the plain
         one is the fallback for browsers that ignore the media attribute. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1113" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Fetched before the CSS that references it, so the swap from the
         fallback happens as early as possible. crossorigin is required even
         same-origin: fonts are always fetched in CORS mode, and without it the
         browser downloads the file twice. -->
    <link
      rel="preload"
      href="/fonts/satoshi-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: that renders the page *underneath* the iOS
         status bar, which is what was hiding the header once installed, and it
         forces white status-bar text that vanishes on the light header. With
         default, iOS reserves the bar and follows the system appearance.
         The safe-area padding in the CSS still runs, and covers Android
         display cutouts and both platforms in landscape. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Oeank" />
    <title>Oeank — karena rakyat desa gapake dollar</title>
    <meta name="description" content="Track income and expenses in your own Google Sheet — works offline." />
  </head>
  <body>
    <!-- Applies the stored theme before the bundle loads. In a React effect
         this would flash the default palette on every cold start, which is the
         one thing that would make theming feel broken. Kept deliberately small;
         utils/theme.ts holds the real derivation and a test pins the two to the
         same answers. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('finance:appearance');
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
          var accent = localStorage.getItem('finance:accent');
          if (!accent || !/^#[0-9a-f]{6}$/i.test(accent) || accent === '#111111') return;
          var n = parseInt(accent.slice(1), 16);
          var ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
            v /= 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          var lum = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
          var white = 1.05 / (lum + 0.05);
          var black = (lum + 0.05) / 0.05499;
          var root = document.documentElement;
          root.setAttribute('data-accent', '');
          root.style.setProperty('--accent', accent);
          root.style.setProperty('--on-accent', white >= black ? '#ffffff' : '#111111');
        } catch (e) {
          /* Storage blocked; the stylesheet defaults stand. */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
