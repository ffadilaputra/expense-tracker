<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colours the system status bar on Android. Two entries so it tracks the
         app instead of being a fixed dark bar above a white header; the plain
         one is the fallback for browsers that ignore the media attribute. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1113" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Fetched before the CSS that references it, so the swap from the
         fallback happens as early as possible. crossorigin is required even
         same-origin: fonts are always fetched in CORS mode, and without it the
         browser downloads the file twice. -->
    <link
      rel="preload"
      href="/fonts/satoshi-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: that renders the page *underneath* the iOS
         status bar, which is what was hiding the header once installed, and it
         forces white status-bar text that vanishes on the light header. With
         default, iOS reserves the bar and follows the system appearance.
         The safe-area padding in the CSS still runs, and covers Android
         display cutouts and both platforms in landscape. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Uang" />
    <title>Uang — Personal Finance</title>
    <meta name="description" content="Track income and expenses in your own Google Sheet — works offline." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
