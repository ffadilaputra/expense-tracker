# Netlify build + hosting config for Uang (personal finance).
#
# Deploys are driven by Netlify's Git integration: every push to `main`
# publishes production, and every pull request gets its own Deploy Preview URL.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  # Pinned so CI, Netlify, and local dev don't drift onto different majors.
  NODE_VERSION = "22"
  PNPM_VERSION = "11"

# The app is a single-page app served entirely from index.html. Without this
# rewrite, refreshing on any path other than "/" - or opening a Deploy
# Preview deep link - returns Netlify's 404 page instead of the app.
# status 200 (rewrite, not redirect) keeps the URL in the address bar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Caching -----------------------------------------------------------
# Vite fingerprints everything in /assets, so those files are immutable: a
# change produces a new filename, never new content at the same URL.
# Everything else must revalidate.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must NEVER be served stale, or a browser holding a cached
# copy of sw.js keeps running the old worker and serves a previous build's
# shell indefinitely. max-age=0 forces revalidation on every load.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# index.html references the hashed asset names; if it is cached, users get old
# asset URLs and never see a new deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# --- Security headers --------------------------------------------------
# No Content-Security-Policy here: the app submits to a user-supplied Apps
# Script URL entered at runtime, so the allowed connect-src origins aren't
# known at build time. A CSP strict enough to be worth adding would need that
# accounted for.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The finance app needs none of these device features.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
